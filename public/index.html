<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="stylesheet" href="/style.css?v=10"><title>Agent Fort</title></head><body>
<header><b>AGENT FORT</b><span id="connection" role="status">connecting</span><button id="install" hidden>install</button><button id="update" title="Load the latest app version">update</button><button id="logout" hidden>lock</button></header>
<main><section id="login" hidden><h1>Agent Fort</h1><p>Private fortress · enter server access key</p><form id="login-form"><label for="key">Access key</label><input id="key" type="password" autocomplete="current-password" required><button>enter</button></form></section>
<section id="dashboard" hidden><div class="mapbar"><span id="stats"></span><span class="map-controls"><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-in" aria-label="Zoom in">+</button><button id="help" aria-label="Map legend">?</button></span></div><div id="world"><canvas id="fortress" role="img" aria-label="Agent fortress: chat chambers on the left, tool workshops on the right. Select an agent to inspect."></canvas><div id="accessible-agents" class="sr-only"></div></div><footer><form id="task-form"><label for="prompt">command&gt;</label><input id="prompt" maxlength="16000" required placeholder="give Hermes a task" autocomplete="off"><button id="send">send ↵</button></form></footer></section><p id="notice" role="alert"></p></main>
<dialog id="detail"><div class="dialog-head"><b id="detail-title">Agent</b><button id="stop" hidden>stop run</button><button id="close">close ×</button></div><div id="detail-body"></div></dialog><script src="/app.js?v=10" defer></script></body></html>
